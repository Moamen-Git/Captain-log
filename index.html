<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>يومية الكابتن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
/* Layout: one-column phone app, bottom tab bar, four views (summary / new day / log / car). */
:root{
  --bg:#100F18; --surface:#1A1824; --surface2:#262338; --ink:#ECE9F7; --muted:#A8A2C4; --line:#3A3656;
  --accent:#6D4FE0; --accent-ink:#FFFFFF; --accent-soft:#2A2352; --accent-fg:#C4B7FF;
  --warn:#F4B35E; --warn-soft:#3A2A10; --bad:#FF8A7E; --bad-soft:#3D1A16;
  --font:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55; direction:rtl;
  padding-block:16px 104px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; min-width:0}
h1,h2,h3,p{margin:0}
h1{font-size:20px; font-weight:800; text-wrap:balance}
h2{font-size:16px; font-weight:800}
.muted{color:var(--muted); font-size:13px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px}
.status{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap}
.dot{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.status.ok .dot{background:var(--accent)}
.status.bad .dot{background:var(--bad)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0}
.monthbar{display:flex; align-items:center; justify-content:space-between; gap:8px}
.monthbar h1{flex:1; text-align:center}
.iconbtn{
  width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font:inherit; font-size:22px; line-height:1; cursor:pointer;
}
.hero{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); display:flex; flex-direction:column; gap:2px}
.hero .lbl{font-size:13px; opacity:.85}
.hero .num{font-size:38px; font-weight:800; line-height:1.2; font-variant-numeric:tabular-nums}
.hero .sub{font-size:13px; opacity:.85}
#homeBody{display:flex; flex-direction:column; gap:14px; min-width:0}
textarea{min-height:130px; direction:ltr; font-size:12px; font-family:monospace}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:2px; min-width:0}
.kpi .k{font-size:12px; color:var(--muted)}
.kpi .v{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.neg{color:var(--bad)}
.sum{color:var(--accent-fg); font-weight:800}
.odobig{font-size:36px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent-fg); line-height:1.2}
.seg{display:flex; gap:8px}
.segb{flex:1; min-height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); font:inherit; font-weight:800; font-size:15px; cursor:pointer}
.segb[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.segb[data-v=unpaid][aria-pressed=true]{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field label{font-size:12px; color:var(--muted); font-weight:600}
input,select,textarea{
  width:100%; min-width:0; font:inherit; font-size:16px; color:var(--ink); background:var(--surface2);
  border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:46px;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums}
.form{display:flex; flex-direction:column; gap:12px}
.btn{
  min-height:48px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  font:inherit; font-weight:800; font-size:16px; cursor:pointer; padding:0 18px;
}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line); font-weight:600}
.btn.danger{background:var(--bad-soft); color:var(--bad); border-color:var(--bad-soft)}
.btn[disabled]{opacity:.6; cursor:default}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.row>*{flex:1 1 140px}
.preview{background:var(--accent-soft); border-radius:12px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px}
.preview b{font-size:22px; font-variant-numeric:tabular-nums; white-space:nowrap; flex:none}
.preview span{min-width:0}
.banner{background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600}
.list{display:flex; flex-direction:column; gap:8px}
.item{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; gap:12px; align-items:center; justify-content:space-between; min-width:0; cursor:pointer}
.item.plain{cursor:default}
.item .l{display:flex; flex-direction:column; gap:2px; min-width:0}
.item .t{font-weight:800}
.item .m{font-size:12px; color:var(--muted); overflow-wrap:anywhere}
.item .r{font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:left}
.pill{display:inline-block; font-size:12px; font-weight:800; border-radius:99px; padding:1px 9px; background:var(--accent-soft); color:var(--accent-fg)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.empty{text-align:center; padding:28px 12px; display:flex; flex-direction:column; gap:10px; align-items:center}
.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--muted); font-family:var(--font); font-size:9px}
.chart .bar{fill:var(--accent)}
.chart .bar.n{fill:var(--bad)}
.chart .base{stroke:var(--line); stroke-width:1}
#nav{
  position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  display:flex; justify-content:center;
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
#nav .in{display:flex; width:100%; max-width:560px; gap:4px}
#nav button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; border:0; background:transparent;
  color:var(--muted); font:inherit; font-size:12px; font-weight:600; padding:6px 0; border-radius:10px; cursor:pointer; min-height:52px;
}
#nav button svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
#nav button[aria-current=page]{color:var(--accent-fg); background:var(--accent-soft)}
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); z-index:6;
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-weight:600; font-size:14px;
  max-width:90vw; transition:opacity .2s; opacity:0; pointer-events:none;
}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<style>[hidden]{display:none!important}html,body{margin:0}html{background:var(--bg)}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav" aria-label="التنقل">
  <div class="in">
    <button data-a="go" data-v="home"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>الملخص</button>
    <button data-a="go" data-v="add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>يوم جديد</button>
    <button data-a="go" data-v="log"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>السجل</button>
    <button data-a="go" data-v="car"><svg viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5 5L3 18l3 3 6.5-6.5a4 4 0 0 0 5-5l-2.5 2.5-2-.5-.5-2z"/></svg>العربية</button>
  </div>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  document.documentElement.lang = 'ar';
  document.documentElement.dir = 'rtl';

  var TYPES = ['زيت موتور','فلتر زيت','فلتر هواء','فلتر بنزين','فلتر مكيف','إطارات','فرامل / فحمات','بطارية','سيور / جنزير','شمعات','مساعدين / عفشة','كهرباء','تكييف','غسيل','تأمين','رخصة / مخالفات','صيانة دورية','قطع غيار','أخرى'];
  var LS_KEY = 'captain-log-v1';

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function ym(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function fmt(n, d){
    if (d == null) d = 2;
    return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: d });
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function nameDate(s){
    var p = s.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    try { return d.toLocaleDateString('ar-EG-u-nu-latn', { weekday:'long', day:'numeric', month:'short' }); }
    catch (e) { return s; }
  }
  function nameMonth(m){
    var p = m.split('-');
    var d = new Date(+p[0], +p[1] - 1, 1);
    try { return d.toLocaleDateString('ar-EG-u-nu-latn', { month:'long', year:'numeric' }); }
    catch (e) { return m; }
  }
  function netOf(r){ return num(r.gross) + num(r.tips) - num(r.fuel) - num(r.other); }

  var state = { view:'home', month: ym(new Date()), editDate:null, armed:null, status:'loading' };
  var rows = [];
  var mode = 'none';
  var col = null;
  var dl = null;
  var saving = false;

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function days(){ return rows.filter(function(r){ return r.kind === 'day'; }); }
  function cars(){ return rows.filter(function(r){ return r.kind === 'car'; }); }

  /* ---------------------------------------------------------------- storage */
  function lsRead(){
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; }
  }
  function lsWrite(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(rows)); } catch (e) {}
  }
  function put(id, obj){
    if (mode === 'db') return col.doc(id).set(obj);
    var o = Object.assign({ id:id }, obj);
    rows = rows.filter(function(r){ return r.id !== id; }).concat([o]);
    lsWrite(); fill();
    return Promise.resolve();
  }
  function remove(id){
    if (mode === 'db') return col.doc(id).delete();
    rows = rows.filter(function(r){ return r.id !== id; });
    lsWrite(); fill();
    return Promise.resolve();
  }
  function useLocal(note){
    mode = 'local';
    rows = lsRead();
    state.status = note || 'local';
    fill();
  }

  async function init(){
    render();
    if (!window.claude || !window.claude.use){ useLocal(); return; }
    try {
      var got = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
      var db = got[0], user = got[1];
      dl = got[2];
      var uid = user ? await user.id() : null;
      if (!db || !uid){ useLocal(); return; }
      mode = 'db';
      col = db.collection('data/users/' + uid);
      var timer = setTimeout(function(){ if (state.status === 'loading'){ state.status = 'slow'; fillStatus(); } }, 10000);
      col.onSnapshot(function(snap){
        rows = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
        if (!snap.metadata.fromCache){ clearTimeout(timer); state.status = 'ok'; }
        else if (state.status === 'loading'){ state.status = 'ok'; }
        fill();
      }, function(){
        clearTimeout(timer);
        useLocal('fallback');
      });
    } catch (e) {
      useLocal();
    }
  }

  /* ---------------------------------------------------------------- views */
  function statusHtml(){
    var s = state.status, cls = '', txt = 'بيحمّل...';
    if (s === 'ok'){ cls = 'ok'; txt = 'محفوظ على التليفون'; }
    else if (s === 'slow'){ cls = 'bad'; txt = 'مش قادر أوصل للبيانات'; }
    else if (s === 'local' || s === 'fallback'){ cls = 'ok'; txt = 'محفوظ على التليفون'; }
    return '<span class="status ' + cls + '"><span class="dot"></span>' + txt + '</span>';
  }
  function fillStatus(){
    var el = document.getElementById('status');
    if (el) el.innerHTML = statusHtml();
  }

  function monthBar(){
    return '<div class="monthbar">' +
      '<button class="iconbtn" data-a="pm" aria-label="الشهر اللي فات">›</button>' +
      '<h1 id="mlabel"></h1>' +
      '<button class="iconbtn" data-a="nm" aria-label="الشهر الجاي">‹</button></div>';
  }

  function render(){
    document.querySelectorAll('#nav button').forEach(function(b){
      if (b.dataset.v === state.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    var v = state.view, h = '';
    if (v === 'home'){
      h = '<div class="topbar"><h2>يومية الكابتن</h2><span id="status"></span></div><div id="bkTop" hidden></div>' + monthBar() + '<div id="homeBody"></div><div id="bkCard" class="card form"></div>';
    } else if (v === 'log'){
      h = '<div class="topbar"><h2>سجل الأيام</h2><span id="status"></span></div>' + monthBar() + '<div id="logBody" class="list"></div>';
    } else if (v === 'add'){
      h = addForm();
    } else {
      h = carView();
    }
    app.innerHTML = h;
    if (v === 'home') bkRender();
    if (v === 'add') initAdd();
    if (v === 'car') initCar();
    fill();
    window.scrollTo(0, 0);
  }

  function f(id, label, type, extra){
    return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'number') + '" ' + (extra || 'inputmode="decimal" min="0" step="any"') + '></div>';
  }

  var TEXT_KEYS = ['other','home','debts','kmOther'];
  function sumText(v){
    var t = String(v == null ? '' : v)
      .replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 0x0660); })
      .replace(/٫/g, '.')
      .replace(/(\d)[,،](?=\d{3}(?!\d))/g, '$1');
    var m = t.match(/\d+(?:\.\d+)?/g) || [];
    return m.reduce(function(a, x){ return a + parseFloat(x); }, 0);
  }
  function isPlainNumber(v){
    return /^\s*[\d٠-٩]+([.٫][\d٠-٩]+)?\s*$/.test(String(v));
  }
  var DEFAULT_RATE = 2;
  var saveTouched = false;
  var debtsPaid = false;
  function debtSegRender(){
    var seg = document.getElementById('debtSeg');
    if (!seg) return;
    var fd = document.getElementById('f-debts');
    seg.hidden = !(fd && sumText(fd.value) > 0);
    seg.querySelectorAll('button').forEach(function(bt){ bt.setAttribute('aria-pressed', String((bt.dataset.v === 'paid') === debtsPaid)); });
  }
  function getRate(){
    var r = rows.filter(function(x){ return x.kind === 'settings'; })[0];
    return r && isFinite(+r.rate) && +r.rate >= 0 ? +r.rate : DEFAULT_RATE;
  }
  function suggestSave(){
    var km = num(document.getElementById('f-km').value);
    return km > 0 ? Math.round(km * getRate()) : 0;
  }
  function updateSaveHint(){
    var h = document.getElementById('saveHint');
    if (!h) return;
    var km = num(document.getElementById('f-km').value);
    if (!km){ h.innerHTML = ''; return; }
    var sug = suggestSave();
    var cur = document.getElementById('f-save').value.trim();
    var same = cur !== '' && num(cur) === sug;
    h.innerHTML = 'المقترح: <span class="sum">' + fmt(sug, 0) + ' ج.م</span> (' + fmt(km, 1) + ' كم × ' + fmt(getRate(), 2) + ' ج.م للكيلو)' +
      (same ? '' : ' <button class="btn ghost" type="button" data-a="useSug" style="min-height:34px;font-size:13px;padding:0 10px">استخدم المقترح</button>');
  }
  function autoSave(){
    var el = document.getElementById('f-save');
    if (!el) return;
    if (!saveTouched){
      var sug = suggestSave();
      el.value = sug ? String(sug) : '';
    }
    updateSaveHint();
  }
  function getSettings(){
    return rows.filter(function(x){ return x.kind === 'settings'; })[0] || {};
  }
  function saveSettings(patch){
    var cur = Object.assign({}, getSettings()); delete cur.id;
    return put('settings', Object.assign({ kind:'settings', rate: getRate() }, cur, patch));
  }
  function odoIsSet(){ var o = getSettings().odoOffset; return o != null && o !== '' && isFinite(+o); }
  function dayKm(r){ return num(r.km) + num(r.kmOther); }
  function totalKm(){ return days().reduce(function(a, r){ return a + dayKm(r); }, 0); }
  function odoBefore(date){
    var t = 0;
    days().forEach(function(r){ if (r.date < date) t += dayKm(r); });
    return num(getSettings().odoOffset) + t;
  }
  function odoAfter(date){
    var t = 0;
    days().forEach(function(r){ if (r.date <= date) t += dayKm(r); });
    return num(getSettings().odoOffset) + t;
  }
  function currentOdo(){ return odoIsSet() ? num(getSettings().odoOffset) + totalKm() : 0; }
  function odoHintRender(){
    var h = document.getElementById('odoHint');
    if (!h) return;
    var add = num(document.getElementById('f-km').value) + sumText(document.getElementById('f-kmOther').value), t = '';
    if (odoIsSet()){
      var before = odoBefore(document.getElementById('f-date').value);
      t = 'العداد كان ' + fmt(before, 0) + (add > 0 ? ' وهيبقى ' + fmt(before + add, 0) : '');
    } else if (add > 0){
      t = 'اضبط العداد من تاب العربية علشان الكيلومترات دي تتضاف عليه.';
    }
    h.textContent = t; h.hidden = !t;
  }
  function tf(id, label){
    return '<div class="field"><label for="' + id + '">' + label + ' <span class="sum" id="s-' + id.slice(2) + '"></span></label>' +
      '<input id="' + id + '" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="next"></div>';
  }
  function itemsText(r){
    var out = [];
    [['kmOther','مشاوير'],['other','رسوم'],['home','إضافية'],['debts','ديون']].forEach(function(p){
      if (r[p[0] + 'T']) out.push(p[1] + ': ' + r[p[0] + 'T']);
    });
    return out.join(' | ');
  }
  function addForm(){
    return '<div class="topbar"><h2>تسجيل يوم</h2><span id="status"></span></div>' +
      '<div id="editBanner" class="banner" hidden>اليوم ده متسجّل قبل كده. أي تعديل هيحل محله.</div>' +
      '<div class="card form">' +
        f('f-date', 'التاريخ', 'date', '') +
        '<div class="row">' + f('f-trips', 'عدد الرحلات', 'number', 'inputmode="numeric" min="0" step="1"') + f('f-km', 'كيلومترات الشغل') + '</div>' +
        tf('f-kmOther', 'كيلومترات خارج الشغل (مشاوير)') +
        '<div id="odoHint" class="muted" hidden></div>' +
        '<div class="row">' + f('f-hours', 'ساعات الشغل') + f('f-gross', 'إيراد الرحلات (بعد عمولة أوبر)') + '</div>' +
        '<div class="row">' + f('f-tips', 'بقشيش / مكافآت') + tf('f-other', 'مصاريف إضافية (باركينج/رسوم)') + '</div>' +
        '<div class="row">' + f('f-liters', 'لترات البنزين') + f('f-fuel', 'تكلفة البنزين') + '</div>' +
        f('f-save', 'صيانة العربية') +
        '<div id="saveHint" class="muted"></div>' +
        '<h2>الفلوس</h2>' +
        f('f-cash', 'إجمالي الفلوس') +
        f('f-pocket', 'محفظتي') +
        tf('f-home', 'مصاريف إضافية') +
        tf('f-debts', 'الديون') +
        '<div id="debtSeg" class="seg" hidden><button type="button" class="segb" data-a="debtSt" data-v="unpaid">لسه ما اتدفعش</button><button type="button" class="segb" data-a="debtSt" data-v="paid">اتدفع</button></div>' +
        '<div class="field"><label for="f-note">ملاحظات</label><input id="f-note" type="text" autocomplete="off"></div>' +
        '<div class="preview"><span>صافي الربح</span><b id="f-net">0</b></div>' +

  function chartSvg(list){
    var p = state.month.split('-');
    var n = new Date(+p[0], +p[1], 0).getDate();
    var vals = [];
    for (var i = 1; i <= n; i++){
      var key = state.month + '-' + pad(i);
      var r = list.filter(function(x){ return x.date === key; })[0];
      vals.push(r ? netOf(r) : null);
    }
    var nums = vals.filter(function(v){ return v != null; });
    var hi = Math.max.apply(null, nums.concat([0])), lo = Math.min.apply(null, nums.concat([0]));
    var range = (hi - lo) || 1;
    var W = 320, H = 96, top = 14, bot = 14, left = 4;
    var inner = H - top - bot;
    var slot = (W - left * 2) / n, bw = slot * 0.64;
    var y = function(v){ return top + (hi - v) / range * inner; };
    var y0 = y(0);
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="صافي الربح لكل يوم في الشهر">';
    s += '<text x="' + left + '" y="9">' + fmt(hi, 0) + '</text>';
    s += '<line class="base" x1="' + left + '" x2="' + (W - left) + '" y1="' + y0 + '" y2="' + y0 + '"/>';
    vals.forEach(function(v, idx){
      var x = left + idx * slot + (slot - bw) / 2;
      if (v != null){
        var yy = y(v), h = Math.max(1.5, Math.abs(yy - y0));
        s += '<rect class="bar' + (v < 0 ? ' n' : '') + '" x="' + x.toFixed(2) + '" y="' + (v >= 0 ? yy : y0).toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + h.toFixed(2) + '" rx="1.5"/>';
      }
      var dn = idx + 1;
      if (dn === 1 || dn % 5 === 0) s += '<text x="' + (x + bw / 2).toFixed(2) + '" y="' + (H - 2) + '" text-anchor="middle">' + dn + '</text>';
    });
    if (lo < 0) s += '<text x="' + left + '" y="' + (H - 14) + '">' + fmt(lo, 0) + '</text>';
    return s + '</svg>';
  }

  function sum(list, k){ return list.reduce(function(a, r){ return a + num(r[k]); }, 0); }

  function fillHome(){
    var el = document.getElementById('homeBody');
    if (!el) return;
    var all = days();
    var list = all.filter(function(r){ return (r.date || '').indexOf(state.month) === 0; });
    if (!list.length && !all.length){
      el.innerHTML = '<div class="card empty"><h2>لسه مفيش أيام متسجلة</h2><p class="muted">سجّل أول يوم شغل وهتشوف هنا صافي ربحك، الكيلومترات، عمولة أوبر ومصاريف البنزين.</p><button class="btn" data-a="go" data-v="add">سجّل أول يوم</button></div>';
      return;
    }
    var gross = sum(list, 'gross'), tips = sum(list, 'tips'), fuel = sum(list, 'fuel'), other = sum(list, 'other');
    var net = gross + tips - fuel - other;
    var km = sum(list, 'km'), hrs = sum(list, 'hours'), trips = sum(list, 'trips');
    var worked = list.filter(function(r){ return num(r.gross) > 0; }).length;
    var saved = sum(list, 'save');
    var spent = cars().filter(function(c){ return (c.date || '').indexOf(state.month) === 0; }).reduce(function(a, c){ return a + num(c.cost); }, 0);
    var fundAll = sum(all, 'save') - cars().reduce(function(a, c){ return a + num(c.cost); }, 0);
    var perKm = km ? net / km : 0, perHr = hrs ? net / hrs : 0, perDay = worked ? net / worked : 0;
    var h = '<div class="card hero"><span class="lbl">صافي ربح الشهر</span><span class="num">' + fmt(net) + ' ج.م</span><span class="sub">' + worked + ' يوم شغل · متوسط ' + fmt(perDay, 0) + ' ج.م في اليوم</span></div>';
    h += '<div class="grid2">' +
      kpi('الرحلات', fmt(trips, 0)) + kpi('كيلومترات الشغل', fmt(km, 1)) +
      kpi('إجمالي الإيراد', fmt(gross)) + kpi('بقشيش / مكافآت', fmt(tips)) +
      kpi('البنزين', fmt(fuel)) + kpi('مصاريف إضافية (باركينج/رسوم)', fmt(other)) +
      kpi('ربح الكيلو', fmt(perKm)) + kpi('ربح الساعة', fmt(perHr)) +
      kpi('كيلومترات خارج الشغل', fmt(sum(list, 'kmOther'), 1)) + kpi('عداد العربية', odoIsSet() ? fmt(currentOdo(), 0) + ' كم' : '-') + '</div>';
    h += '<div class="grid2">' + kpi('محفظتي', fmt(sum(list, 'pocket'))) + kpi('مصاريف إضافية', fmt(sum(list, 'home'))) +
      kpi('ديون لسه عليك', fmt(all.filter(function(r){ return num(r.debts) > 0 && !r.debtsPaid; }).reduce(function(a, r){ return a + num(r.debts); }, 0))) +
      kpi('ديون اتدفعت الشهر ده', fmt(list.filter(function(r){ return num(r.debts) > 0 && r.debtsPaid; }).reduce(function(a, r){ return a + num(r.debts); }, 0))) + '</div>';
    h += '<div class="card"><h2>صافي الربح كل يوم</h2><div style="height:8px"></div>' + (list.length ? chartSvg(list) : '<p class="muted">مفيش أيام في الشهر ده.</p>') + '</div>';
    h += '<div class="card"><h2>صندوق العربية</h2><div style="height:8px"></div><div class="grid2">' +
      kpi('مخصص للصيانة', fmt(saved)) + kpi('مصروف الشهر ده', fmt(spent)) + '</div>' +
      '<div style="height:10px"></div><div class="preview"><span>الرصيد الكلي</span><b class="' + (fundAll < 0 ? 'neg' : '') + '">' + fmt(fundAll) + ' ج.م</b></div></div>';
    if (dl){
      h += '<div class="row"><button class="btn ghost" data-a="expDays">تصدير اليوميات CSV</button><button class="btn ghost" data-a="expCar">تصدير مصاريف العربية CSV</button></div>';
    }
    el.innerHTML = h;
  }
  function kpi(k, v){ return '<div class="kpi"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }

  function fillCar(){
    var st = document.getElementById('carStats');
    var ls = document.getElementById('carList');
    if (!st || !ls) return;
    var cs = cars().sort(function(a, b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    var odo = latestOdo();
    var total = cs.reduce(function(a, c){ return a + num(c.cost); }, 0);
    st.innerHTML = kpi('آخر قراءة عداد', odo ? fmt(odo, 0) + ' كم' : '-') + kpi('إجمالي المصاريف', fmt(total) + ' ج.م');
    var ob = document.getElementById('odoBig'), oi = document.getElementById('odoInfo');
    if (ob && oi){
      var wk = sum(days(), 'km'), ot = sum(days(), 'kmOther');
      if (odoIsSet()){
        ob.textContent = fmt(currentOdo(), 0) + ' كم';
        oi.textContent = 'منذ بدأت التسجيل: شغل ' + fmt(wk, 1) + ' كم، وخارج الشغل ' + fmt(ot, 1) + ' كم. أي كيلومترات تسجلها في «يوم جديد» بتتضاف هنا لوحدها.';
      } else {
        ob.textContent = '-';
        oi.textContent = 'العداد لسه متضبطش. اكتب قراءة العداد دلوقتي وادوس ضبط، وبعدها كل كيلومتر تسجله (شغل أو مشوار) بيتضاف لوحده.';
      }
    }
    var ri = document.getElementById('rateInfo');
    if (ri){
      var kmAll = sum(days(), 'km');
      var txt = 'يعني كل 100 كم بتحوّش ' + fmt(getRate() * 100, 0) + ' ج.م.';
      if (kmAll > 0 && total > 0){
        txt += ' التكلفة الفعلية من مصاريف العربية اللي سجلتها: ' + fmt(total / kmAll, 2) + ' ج.م للكيلو (' + fmt(total, 0) + ' ج.م على ' + fmt(kmAll, 0) + ' كم)' + (kmAll < 1000 ? '. الرقم ده لسه بدري يتحكم بيه لأن الكيلومترات قليلة.' : '.');
      }
      ri.textContent = txt;
    }
    // reminders only count on the newest entry of each type
    var seen = {};
    var latestByType = {};
    cs.forEach(function(c){ if (!seen[c.type]){ seen[c.type] = 1; latestByType[c.id] = true; } });
    if (!cs.length){
      ls.innerHTML = '<div class="card empty"><p class="muted">لسه مفيش مصاريف. أول ما تغيّر زيت أو تجيب حاجة للعربية اكتبها فوق.</p></div>';
      return;
    }
    ls.innerHTML = cs.map(function(c){
      var meta = nameDate(c.date);
      if (num(c.odo)) meta += ' · عداد ' + fmt(c.odo, 0);
      if (c.place) meta += ' · ' + esc(c.place);
      var pill = '';
      if (latestByType[c.id] && num(c.next) && odo){
        var left = num(c.next) - odo;

        else if (left <= 500) pill = ' <span class="pill warn">باقي ' + fmt(left, 0) + ' كم</span>';
        else pill = ' <span class="pill">باقي ' + fmt(left, 0) + ' كم</span>';
      }
      var armed = state.armed === c.id;
      return '<div class="item plain"><div class="l"><span class="t">' + esc(c.type) + pill + '</span>' +
        '<span class="m">' + (c.detail ? esc(c.detail) + ' · ' : '') + meta + '</span></div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px"><span class="r">' + fmt(c.cost) + '</span>' +
        '<button class="btn ' + (armed ? 'danger' : 'ghost') + '" style="min-height:34px;font-size:13px;padding:0 10px" data-a="delCar" data-id="' + esc(c.id) + '">' + (armed ? 'تأكيد الحذف' : 'حذف') + '</button></div></div>';
    }).join('');
  }

    if (bkMode === 'make'){
      h += '<div class="field"><label for="bk-text">النسخة (انسخها أو شاركها واحتفظ بيها)</label><textarea id="bk-text" readonly>' + esc(backupText()) + '</textarea></div>' +
        '<div class="row">' + (plugin('Share') ? '<button class="btn" data-a="bkShare">مشاركة</button>' : '') + '<button class="btn" data-a="bkCopy">نسخ</button></div>';
    } else if (bkMode === 'restore'){
      h += '<div class="field"><label for="bk-text">الصق النسخة هنا</label><textarea id="bk-text"></textarea></div>' +
        '<button class="btn" data-a="bkRestore">استرجاع</button>';
    }
    el.innerHTML = h;
  }

  async function restoreRaw(raw){
    raw = String(raw || '').replace(/^﻿/, '').trim();
    if (raw.indexOf('CAPTAINLOG1:') !== 0){ toast('النسخة مش صحيحة'); return; }
    var list;
    try { list = JSON.parse(raw.slice(12)); } catch (e) { toast('النسخة مش صحيحة'); return; }
    if (!Array.isArray(list)){ toast('النسخة مش صحيحة'); return; }
    var ok = list.filter(function(r){
      if (!r || typeof r.id !== 'string') return false;
      if (r.id === 'settings') return r.kind === 'settings' && isFinite(+r.rate) && +r.rate >= 0;
      return /^(day|car)-[A-Za-z0-9_.:@+~-]+$/.test(r.id) &&
        (r.kind === 'day' || r.kind === 'car') && typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date);
    });
    if (!ok.length){ toast('مفيش بيانات صالحة في النسخة'); return; }
    try {
      if (mode === 'local'){
        var ids = {};
        ok.forEach(function(r){ ids[r.id] = 1; });
        rows = rows.filter(function(r){ return !ids[r.id]; }).concat(ok);
        lsWrite(); fill();
      } else {
        for (var i = 0; i < ok.length; i++){
          var o = Object.assign({}, ok[i]); delete o.id;
          await put(ok[i].id, o);
        }
      }
      toast('اتسترجع ' + ok.length + ' سجل ✓');
      bkMode = null; bkRender();
    } catch (e) { toast('معرفتش أسترجع، جرّب تاني'); }
  }

  document.addEventListener('change', function(e){
    var t = e.target;
    if (!t || t.id !== 'bk-file' || !t.files || !t.files[0]) return;
    var file = t.files[0];
    if (file.size > 5 * 1024 * 1024){ toast('الملف ده كبير ومش نسخة احتياطية'); t.value = ''; return; }
    var rd = new FileReader();
    rd.onload = function(){ restoreRaw(String(rd.result || '')); t.value = ''; };
    rd.onerror = function(){ toast('معرفتش أقرا الملف'); };
    rd.readAsText(file);
  });

  var actions = {
    go: function(b){ state.view = b.dataset.v; state.armed = null; bkMode = null; render(); },
    bkMake: function(){
      if (!rows.length){ toast('مفيش بيانات تتحفظ لسه'); return; }
      bkMode = 'make'; bkRender();
    },
    bkAsk: function(){ bkMode = 'restore'; bkRender(); },
    saveOdo: async function(b){
      var v = parseFloat(document.getElementById('o-set').value);
      if (!isFinite(v) || v < 0){ toast('اكتب قراءة العداد'); return; }
      b.disabled = true;
      try { await saveSettings({ odoOffset: v - totalKm() }); toast('اتضبط ✓'); }
      catch (e) { toast('معرفتش أحفظ، جرّب تاني'); }
      b.disabled = false;
    },
    debtSt: function(b){ debtsPaid = b.dataset.v === 'paid'; preview(); },
    useSug: function(){ saveTouched = false; autoSave(); preview(); },
    bkFile: async function(b){
      if (!rows.length){ toast('مفيش بيانات تتحفظ لسه'); return; }
      var Fs = plugin('Filesystem'), Sh = plugin('Share');
      if (!Fs || !Sh){ toast('الحفظ في ملف مش متاح هنا، استخدم النسخة كنص'); bkMode = 'make'; bkRender(); return; }
      b.disabled = true;
      try {
        var res = await Fs.writeFile({ path: 'captain-log-backup-' + ymd(new Date()) + '.json', data: backupText(), directory: 'CACHE', encoding: 'utf8' });
        await Sh.share({ title: 'نسخة يومية الكابتن', text: 'نسخة احتياطية ليومية الكابتن', url: res.uri, dialogTitle: 'احفظ النسخة أو ابعتها لنفسك' });
        markBackup(); bkRender();
      } catch (e) {
        if (!/cancel/i.test(String(e && e.message))) toast('معرفتش أعمل النسخة، جرّب تاني');
      }
      b.disabled = false;
    },
    bkPick: function(){ var f = document.getElementById('bk-file'); if (f) f.click(); },
    saveRate: async function(b){
      var v = parseFloat(document.getElementById('r-rate').value);
      if (!isFinite(v) || v < 0){ toast('اكتب رقم صحيح'); return; }
      b.disabled = true;
      try { await saveSettings({ rate: v }); toast('اتحفظ ✓'); }
      catch (e) { toast('معرفتش أحفظ، جرّب تاني'); }
      b.disabled = false;
    },
    bkCopy: function(){
      var ta = document.getElementById('bk-text');
      if (!ta) return;
      var done = function(){ toast('اتنسخت ✓'); };
      var fallback = function(){
        ta.focus(); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { toast('حدد النص وانسخه بإيدك'); }
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(done).catch(fallback);
      } else { fallback(); }
    },
    bkShare: function(){
      var Sh = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
      var ta = document.getElementById('bk-text');
      if (!Sh || !ta) return;
      Sh.share({ title:'نسخة يومية الكابتن', text: ta.value, dialogTitle:'ابعت النسخة لنفسك' }).catch(function(){});
    },
    bkRestore: async function(b){
      var ta = document.getElementById('bk-text');
      b.disabled = true;
      await restoreRaw(ta ? ta.value : '');
      b.disabled = false;
    },
    pm: function(){ shiftMonth(-1); },
    nm: function(){ shiftMonth(1); },
    edit: function(b){ state.editDate = b.dataset.d; state.view = 'add'; render(); },
    saveDay: async function(b){
      var o = readDay();
      if (!o.date){ toast('اختار التاريخ'); return; }
      if (o.gross < 0 || o.km < 0){ toast('الأرقام لازم تكون صفر أو أكتر'); return; }
      if (saving) return;
      saving = true; b.disabled = true;
      try {
        await put('day-' + o.date, o);
        state.month = o.date.slice(0, 7);
        toast('اتحفظ ✓');
        document.getElementById('editBanner').hidden = false;
        document.getElementById('delDayBtn').hidden = false;
      } catch (e) { toast('معرفتش أحفظ، جرّب تاني'); }
      saving = false; b.disabled = false;
    },
    delDay: async function(b){
      var date = document.getElementById('f-date').value;
      if (state.armed !== 'day'){ state.armed = 'day'; b.textContent = 'اضغط تاني لتأكيد الحذف'; return; }
      try {
        await remove('day-' + date);
        state.armed = null; toast('اتمسح');
        loadDay(date);
      } catch (e) { toast('معرفتش أمسح، جرّب تاني'); }
    },
    saveCar: async function(b){
      var o = {
        kind:'car',
        date: document.getElementById('c-date').value,
        type: document.getElementById('c-type').value,
        detail: document.getElementById('c-detail').value.trim(),
        cost: num(document.getElementById('c-cost').value),
        odo: num(document.getElementById('c-odo').value),
        next: num(document.getElementById('c-next').value),
        place: document.getElementById('c-place').value.trim()
      };
      if (!o.date){ toast('اختار التاريخ'); return; }
      if (!o.cost && !o.detail){ toast('اكتب التكلفة أو التفاصيل'); return; }
      if (saving) return;
      saving = true; b.disabled = true;
      try {
        await put('car-' + Date.now(), o);
        ['c-detail','c-cost','c-odo','c-next','c-place'].forEach(function(id){ document.getElementById(id).value = ''; });
        toast('اتحفظ ✓');
      } catch (e) { toast('معرفتش أحفظ، جرّب تاني'); }
      saving = false; b.disabled = false;
    },
    delCar: async function(b){
      var id = b.dataset.id;
      if (state.armed !== id){
        state.armed = id; fillCar();
        setTimeout(function(){ if (state.armed === id){ state.armed = null; fillCar(); } }, 4000);
        return;
      }
      state.armed = null;
      try { await remove(id); toast('اتمسح'); } catch (e) { toast('معرفتش أمسح، جرّب تاني'); }
    },
    expDays: function(){
      var head = ['التاريخ','عدد الرحلات','كيلومترات الشغل','كيلومترات خارج الشغل','العداد بعد اليوم','ساعات الشغل','إيراد الرحلات','بقشيش','لترات البنزين','تكلفة البنزين','مصاريف إضافية (باركينج/رسوم)','صيانة العربية','إجمالي الفلوس','محفظتي','مصاريف إضافية','الديون','حالة الدين','تفاصيل البنود','صافي الربح','ملاحظات'];
      var lines = days().sort(function(a, b){ return a.date < b.date ? -1 : 1; }).map(function(r){
        return [r.date, r.trips, r.km, r.kmOther, (odoIsSet() ? Math.round(odoAfter(r.date)) : ''), r.hours, r.gross, r.tips, r.liters, r.fuel, r.other, r.save, r.cash, r.pocket, r.home, r.debts, (num(r.debts) ? (r.debtsPaid ? 'مدفوع' : 'لسه') : ''), itemsText(r), netOf(r), r.note || ''];
      });
      exportCsv('captain-days.csv', head, lines);
    },
    expCar: function(){
      var head = ['التاريخ','النوع','التفاصيل','التكلفة','قراءة العداد','التغيير الجاي عند','المكان'];
      var lines = cars().sort(function(a, b){ return a.date < b.date ? -1 : 1; }).map(function(c){
        return [c.date, c.type, c.detail || '', c.cost, c.odo || '', c.next || '', c.place || ''];
      });
      exportCsv('captain-car.csv', head, lines);
    }
  };

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]');
    if (!b || !actions[b.dataset.a]) return;
    actions[b.dataset.a](b);
  });

  init();
})();
</script>
